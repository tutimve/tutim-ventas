# Registra la tasa USDT/VES (Binance P2P, via Vzla.io) tres veces al dia:
#   8:30 am, 1:00 pm y 5:00 pm hora de Caracas (UTC-4), todos los dias.
# El token vive SOLO en el secreto del repositorio VZLA_TOKEN; nunca en el codigo.
name: Tasa Binance

on:
  schedule:
    - cron: '30 12 * * *'   # 8:30 am Caracas
    - cron: '0 17 * * *'    # 1:00 pm Caracas
    - cron: '0 21 * * *'    # 5:00 pm Caracas
  workflow_dispatch:         # permite correrlo a mano desde la pestana Actions

permissions:
  contents: write

concurrency:
  group: tasa-binance
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consultar Binance P2P (Vzla.io)
        env:
          VZLA_TOKEN: ${{ secrets.VZLA_TOKEN }}
        run: |
          if [ -z "${VZLA_TOKEN}" ]; then
            echo "Falta el secreto VZLA_TOKEN (Settings > Secrets and variables > Actions)" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -H "Authorization: Bearer ${VZLA_TOKEN}" \
            "https://app.vzla.io/api/quantis/v2/rates/markets/" \
            -o "${RUNNER_TEMP}/respuesta.json"

      - name: Anotar la lectura
        run: python3 scripts/tasa_binance.py "${RUNNER_TEMP}/respuesta.json" tasas_binance.json

      - name: Guardar en el repositorio
        run: |
          git config user.name "tasa-binance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tasas_binance.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Tasa Binance $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 8
          done
          echo "No se pudo subir la lectura" >&2
          exit 1
